<!DOCTYPE html>  
<html lang="zh-TW">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">  
    <title>OR 手術動態看板</title>  
    <style>  
        :root { --bg: #f5f7fa; --card-bg: #ffffff; --primary: #007aff; --success: #34c759; --danger: #ff3b30; --text: #111; }  
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }  
        body { background: var(--bg); color: var(--text); padding: 10px; padding-bottom: 80px; }  
        h3 { margin: 12px 0 6px 0; font-size: 15px; color: #555; }  
        .page { display: none; }  
        .page.active { display: block; }  
       
        /* 導覽列 */
        .nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: white; border-top: 1px solid #ddd; display: flex; justify-content: space-around; align-items: center; z-index: 100; }  
        .nav-btn { background: none; border: none; font-size: 16px; font-weight: bold; color: #888; width: 50%; height: 100%; cursor: pointer; }  
        .nav-btn.active { color: var(--primary); background: #f0f7ff; }  
       
        /* 輸入元件 */
        .btn-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; align-items: center; }  
        .btn-opt { background: white; border: 1px solid #ccc; padding: 10px 15px; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; color: #333; }  
        .btn-opt.selected { background: var(--primary); color: white; border-color: var(--primary); }  
        .btn-opt.multi.selected { background: #5856d6; border-color: #5856d6; }  
        .btn-opt.risk-opt { border: 1px dashed var(--danger); color: var(--danger); font-weight: bold; }  
        .btn-opt.risk-opt.selected { background: var(--danger); color: white; border-color: var(--danger); }  
       
        /* 輸入框樣式 */
        .text-input { padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; background: white; }  
        .age-input { width: 100px; font-weight: bold; text-align: center; }  
        .custom-op-input { width: 160px; font-weight: bold; border: 1px dashed var(--primary); }  
        .custom-op-input:focus { border-style: solid; outline: none; background: #e6f7ff; }  
        .memo-input { width: 100%; font-size: 15px; margin-bottom: 15px; }  
        .age-container { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }  
        .submit-btn { width: 100%; background: var(--success); color: white; border: none; padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; margin-top: 20px; }  
        .op-placeholder { font-size: 14px; color: #999; font-style: italic; padding: 10px 0; }  

        /* ============================================================
           🚀 看板橫向滑動、不壓縮格子之全新 CSS 佈局
           ============================================================ */
        .or-row { background: var(--card-bg); border-radius: 12px; padding: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #e8e8e8; }  
        .or-title { font-size: 22px; font-weight: 900; border-left: 6px solid var(--primary); padding-left: 10px; margin-bottom: 10px; color: #000; }  
       
        /* 核心：允許橫向捲動的外部容器 */
        .or-columns-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }  
       
        /* 核心：強迫三直欄橫向排開，總寬度超出螢幕 */
        .or-columns { display: flex; gap: 8px; width: 150%; min-width: 550px; }  
       
        /* 各直欄比例調整：手術中配 42%，其餘配 29% 且往右拉延伸 */
        .status-col { border-radius: 8px; padding: 8px 6px; min-height: 80px; border: 1px solid transparent; flex-shrink: 0; }  
        .status-col.status-current { width: 42%; background-color: #fff0f6; border-color: #ffadd2; } /* 手術中：最寬、不換行 */  
        .status-col.status-wait    { width: 29%; background-color: #fff9db; border-color: #ffe066; } /* 待手術 */  
        .status-col.status-done    { width: 29%; background-color: #ebfbee; border-color: #b2f2bb; } /* 已完成 */  
       
        .status-col h4 { font-size: 14px; text-align: center; margin-bottom: 8px; font-weight: bold; white-space: nowrap; }  
        .status-current h4 { color: #c41d7f; }  
        .status-wait h4    { color: #8a6d00; }  
        .status-done h4    { color: #2b8a3e; }  

        /* 病人卡片（維持大字體） */
        .patient-card { background: #ffffff; border: 1px solid rgba(0,0,0,0.15); border-radius: 6px; padding: 10px; margin-bottom: 6px; line-height: 1.5; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }  
        .patient-card .card-main { font-size: 17px; font-weight: 800; color: #000; word-break: break-all; }   
        .patient-card .card-sub { font-size: 12px; color: #222; display: block; margin-top: 4px; background: rgba(0,0,0,0.05); padding: 3px 5px; border-radius: 4px; font-weight: 600; }  
        .patient-card .card-risk { font-size: 13px; color: var(--danger); font-weight: 900; display: block; margin-top: 4px; }   
        .patient-card .card-memo { font-size: 12px; color: #007aff; display: block; margin-top: 4px; font-style: italic; font-weight: bold; }  
       
        .edit-box { width: 100%; font-size: 13px; padding: 4px; margin-top: 3px; border: 1px solid #999; border-radius: 4px; }  
        .card-actions { display: flex; gap: 4px; margin-top: 8px; justify-content: flex-end; border-top: 1px solid #eee; padding-top: 6px; flex-wrap: wrap; }  
        .action-btn { font-size: 12px; padding: 4px 8px; border: 1px solid #ccc; background: #fff; border-radius: 4px; cursor: pointer; font-weight: bold; }  
        .inline-clear-btn { font-size: 11px; padding: 2px 4px; background: #2b8a3e; color: white; border: none; border-radius: 4px; margin-top: 4px; display: block; width: fit-content; cursor: pointer; font-weight: bold; }  
        .empty-tip { text-align: center; color: #999; margin-top: 50px; font-size: 16px; }  
    </style>
</head>  
<body>  

    <div class="nav">  
        <button class="nav-btn active" onclick="switchPage('input-page', this)">📱 新增手術</button>  
        <button class="nav-btn" onclick="switchPage('board-page', this); renderBoard();">📊 動態看板</button>  
    </div>  

    <div id="input-page" class="page active"></div>  

    <div id="board-page" class="page">  
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">  
            <h2 style="font-size: 22px; font-weight: bold;">今日手術動態 <span style="font-size:12px; color:#999; font-weight:normal;">(可向右滑動 ➔)</span></h2>  
            <div>  
                <button onclick="exportToCSV()" style="padding: 6px 12px; background: #2b8a3e; color: white; border: none; border-radius: 5px; font-size: 13px; font-weight: bold; margin-right: 5px; cursor: pointer;">📥 匯出 Excel 紀錄</button>  
                <button onclick="if(confirm('確定清除全日資料？')) { localStorage.clear(); renderBoard(); }" style="padding: 6px 12px; background: #ff3b30; color: white; border: none; border-radius: 5px; font-size: 13px; font-weight: bold; cursor: pointer;">重置全天</button>  
            </div>  
        </div>  
        <div id="board-container"></div>  
    </div>  

<script>  
    const ROOM_LIST = ['1', '2', '3', '5', '6', '7', '8', '9', '10', '11', '12', '13', '15', '17'];  

    const OP_MAPPING = {  
        'GU':    ['TURBT', 'RIRS', 'RRP', '膀胱鏡', 'URSL', 'TURP', 'TRUS', 'vasetomy'],  
        'GYN':   ['TCR', 'ATH', 'LSC', 'Myomectomy', 'D&C', 'C/S', 'staging'],  
        'Ortho': ['TKR', 'THR', '膝關節鏡', 'RCT', 'radius', 'humerus', 'clavicle', 'femur', 'tibia', 'patella', 'ankle', 'ROI', '骨水泥'],  
        'CVS':   ['CABG', 'AVR', 'MVR', 'AV shunt', 'Varicose', 'port A'],  
        'GS':    ['LC', 'Appen', 'Hernia', '切胃', '切肝', 'port A', 'thyroid', 'parathyroid', 'GI RF'],  
        'CRS':   ['Rt hemi', 'LAR', 'Anal fistula', 'hemorrhoid', '腸造口'],  
        'CS':    ['Lobectomy', 'wedge', 'segemenctectomy', '食道擴張', 'Esophagectomy', 'rib', '腸造口'],  
        'BS':    ['BCS', 'Mastectomy'],  
        'PS':    ['Debridement', 'STSG', 'Flap', '整形'],  
        'NS':    ['Craniotomy', 'L spine', 'C spine', 'VP-shunt', 'RF', '骨水泥', 'brain tumor', 'pituitary tumor'],  
        'ENT':   ['鼻中膈鼻甲', 'FESS', 'LMS', 'Tympanoplasty', 'Thyroid', 'tumor', 'tonsillectomy'],  
        'OPD':   ['cata']  
    };

    const HX_LIST = ['HTN', 'DM', 'CAD', 'Af', 'CVA','asthma', 'COPD', 'CKD', 'H/D', 'BMI', 'BW>100kg','肝硬化','Bokey','Plavix','NOAC','有停藥'];  
    const DATA_LIST = ['Hb < 10','Plt<10萬','Cr > 2','Na<130','K > 5.5','GOT>120','INR>1.5','EKG ok','STD','TWI','RBBB','CXR ok','cardiomegaly','infiltration','echo ok','EF<50','EF<40'];  
    const RISK_LIST = ['高風險', '尚未麻評'];

    const ANES_LIST = ['GA', 'SA', 'IVG', 'EA'];  
    const GENDER_LIST = ['M', 'F'];  

    function initInputPage() {  
        const page = document.getElementById('input-page');  
        page.innerHTML = `  
            <h3>房間 (OR)</h3>  
            <div class="btn-group" id="field-room"></div>  

            <h3>① 年齡 (y/o)</h3>  
            <div class="age-container">  
                <input type="number" inputmode="numeric" id="age-input" class="text-input age-input" placeholder="年齡">  
                <span style="font-weight: bold; color: #555;">歲</span>  
            </div>  

            <h3>② 性別</h3>  
            <div class="btn-group" id="field-gender"></div>  

            <h3>③ 科別</h3>
            <div class="btn-group" id="field-dept"></div>  

            <h3>④ 常用術式 (按鈕/自填二選一)</h3>
            <div class="btn-group" id="field-op">  
                <div class="op-placeholder" id="op-tip">💡 請先點選上方「科別」</div>  
            </div>  

            <h3>⑤ 麻醉方式</h3>  
            <div class="btn-group" id="field-anes"></div>  

            <h3>🚨 臨床警示狀態 (可複選)</h3>
            <div class="btn-group" id="field-risk"></div>  

            <h3>⑥ Hx (病史) - 可複選</h3>
            <div class="btn-group" id="field-hx"></div>  

            <h3>⑦ Data (異常指標) - 可複選</h3>  
            <div class="btn-group" id="field-data"></div>  

            <h3>📝 備註 (選填，直接打字)</h3>
            <input type="text" id="memo-input" class="text-input memo-input" placeholder="有其他簡易紀錄可打在此處...">  

            <button class="submit-btn" onclick="submitPatient()">送出到看板</button>  
        `;
       
        createBtns('room', ROOM_LIST);  
        createBtns('gender', GENDER_LIST);  
        createBtns('dept', Object.keys(OP_MAPPING));  
        createBtns('anes', ANES_LIST);
        createBtns('risk', RISK_LIST, true, true); 
        createBtns('hx', HX_LIST, true);
        createBtns('data', DATA_LIST, true);
    }

    function createBtns(id, list, isMulti = false, isRisk = false) {
        const container = document.getElementById(`field-${id}`);
        list.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = `btn-opt ${isMulti ? 'multi' : 'single'} ${isRisk ? 'risk-opt' : ''}`;
            btn.innerText = opt;
            if (id === 'anes' && opt === 'GA') btn.classList.add('selected');

            btn.onclick = () => {
                if (!isMulti) container.querySelectorAll('.btn-opt').forEach(b => b.classList.remove('selected'));
                btn.classList.toggle('selected');
                if (id === 'dept') updateOpButtons(opt);
            };
            container.appendChild(btn);
        });
    }

    function updateOpButtons(dept) {
        const opContainer = document.getElementById('field-op');
        opContainer.innerHTML = '';
       
        (OP_MAPPING[dept] || []).forEach(name => {
            const btn = document.createElement('button');
            btn.className = 'btn-opt single';
            btn.innerText = name;
            btn.onclick = () => {
                opContainer.querySelectorAll('.btn-opt').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                document.getElementById('custom-op').value = '';
            };
            opContainer.appendChild(btn);
        });

        const input = document.createElement('input');
        input.type = 'text';
        input.id = 'custom-op';
        input.className = 'text-input custom-op-input';
        input.placeholder = '✎ 自填術式';
        input.oninput = () => {
            opContainer.querySelectorAll('.btn-opt').forEach(b => b.classList.remove('selected'));
        };
        opContainer.appendChild(input);
    }

    function switchPage(pageId, navBtn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        navBtn.classList.add('active');
    }

    function resetForm() {
        document.getElementById('age-input').value = '';
        document.getElementById('memo-input').value = '';
        document.querySelectorAll('.btn-opt').forEach(b => b.classList.remove('selected'));
        document.getElementById('field-op').innerHTML = `<div class="op-placeholder">💡 請先點選上方「科別」</div>`;
        document.getElementById('field-anes').querySelectorAll('.btn-opt').forEach(btn => {
            if(btn.innerText === 'GA') btn.classList.add('selected');
        });
    }

    function submitPatient() {
        const getSelected = (id) => {
            const items = Array.from(document.getElementById(`field-${id}`).querySelectorAll('.btn-opt.selected')).map(b => b.innerText);
            return id === 'hx' || id === 'data' || id === 'risk' ? items : items[0] || '';
        };

        const customOpValue = document.getElementById('custom-op') ? document.getElementById('custom-op').value.trim() : '';
        const finalOp = customOpValue || getSelected('op');

        const patient = {
            id: Date.now(),
            room: getSelected('room'),
            age: document.getElementById('age-input').value ? document.getElementById('age-input').value + 'y' : '',
            gender: getSelected('gender'),
            dept: getSelected('dept'),
            op: finalOp,
            anes: getSelected('anes'),
            risk: getSelected('risk'), 
            hx: getSelected('hx'),
            data: getSelected('data'),
            memo: document.getElementById('memo-input').value.trim(),
            status: '待手術',
            isEditing: false
        };

        if(!patient.room) { alert('請選擇房間！'); return; }
        let list = JSON.parse(localStorage.getItem('patients')) || [];
        list.push(patient);
        localStorage.setItem('patients', JSON.stringify(list));
        resetForm();
        alert(`房間 ${patient.room} 新增成功！`);
    }

    function renderBoard() {
        const container = document.getElementById('board-container');
        container.innerHTML = '';
        const patients = JSON.parse(localStorage.getItem('patients')) || [];
        if (!patients.length) {
            container.innerHTML = '<div class="empty-tip">📭 目前尚無手術資料</div>';
            return;
        }

        const activeRooms = ROOM_LIST.filter(r => patients.some(p => p.room === r));
        activeRooms.forEach(roomNum => {
            const roomRow = document.createElement('div');
            roomRow.className = 'or-row';
           
            // 包裹滾動條的容器
            const wrapper = document.createElement('div');
            wrapper.className = 'or-columns-wrapper';
           
            const cols = document.createElement('div');
            cols.className = 'or-columns';
           
            roomRow.innerHTML = `<div class="or-title"><span>Room ${roomNum}</span></div>`;
           
            const statusConfig = [
                { name: '手術中', class: 'status-current' },
                { name: '待手術', class: 'status-wait' },
                { name: '已完成', class: 'status-done' }
            ];

            statusConfig.forEach(cfg => {
                const col = document.createElement('div');
                col.className = `status-col ${cfg.class}`;
                col.innerHTML = `<h4>${cfg.name}</h4>`;
               
                patients.filter(p => p.room === roomNum && p.status === cfg.name).forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'patient-card';
                   
                    if (p.isEditing) {
                        card.innerHTML = `
                            <span style="font-size:11px; font-weight:bold; color:orange;">✏️ 修改中...</span>
                            <input type="text" id="edit-op-${p.id}" class="edit-box" value="${p.op}">
                            <input type="text" id="edit-sub-${p.id}" class="edit-box" value="${p.age}${p.gender} / ${p.anes}">
                            <input type="text" id="edit-hd-${p.id}" class="edit-box" value="${(p.hx||[]).join(',')}${(p.hx&&p.hx.length&&p.data&&p.data.length)?' | ':''}${(p.data||[]).join(',')}">
                            <input type="text" id="edit-memo-${p.id}" class="edit-box" value="${p.memo || ''}">
                            <div class="card-actions">
                                <button class="action-btn" style="background:#2b8a3e; color:white;" onclick="saveInlineEdit(${p.id})">💾 存</button>
                                <button class="action-btn" onclick="toggleInlineEdit(${p.id}, false)">X</button>
                            </div>
                        `;
                    } else {
                        let riskItemsHtml = '';
                        if (p.risk && p.risk.length) {
                            const itemsWithBtns = p.risk.map(r => {
                                if (r === '尚未麻評') {
                                    return `${r}<button class="inline-clear-btn" onclick="clearAnesReview(${p.id})">✓ 已評估</button>`;
                                }
                                return r;
                            });
                            riskItemsHtml = `<span class="card-risk">⚠️ ${itemsWithBtns.join(' / ')}</span>`;
                        }
                       
                        const memoHtml = p.memo ? `<span class="card-memo">✍ ${p.memo}</span>` : '';
                       
                        card.innerHTML = `
                            <div class="card-main">${p.age}${p.gender} ${p.op}</div>
                            <span class="card-sub">[${p.dept || '自填'}] ${p.anes}${p.hx && p.hx.length?' | '+p.hx.join(','):''}${p.data && p.data.length?' | '+p.data.join(','):''}</span>
                            ${riskItemsHtml}
                            ${memoHtml}
                            <div class="card-actions">
                                <button class="action-btn" style="color:#007aff;" onclick="toggleInlineEdit(${p.id}, true)">✎ 改</button>
                                ${cfg.name==='待手術' ? `<button class="action-btn" onclick="update(${p.id},'手術中')">▶ 進入</button>` : ''}
                                ${cfg.name==='手術中' ? `<button class="action-btn" onclick="update(${p.id},'已完成')">✓ 完成</button>` : ''}
                                <button class="action-btn" style="color:red;" onclick="del(${p.id})">刪</button>
                            </div>
                        `;
                    }
                    col.appendChild(card);
                });
                cols.appendChild(col);
            });
            wrapper.appendChild(cols);
            roomRow.appendChild(wrapper);
            container.appendChild(roomRow);
        });
    }

    window.clearAnesReview = (id) => {
        let list = JSON.parse(localStorage.getItem('patients'));
        list = list.map(p => {
            if (p.id === id && p.risk) { p.risk = p.risk.filter(r => r !== '尚未麻評'); }
            return p;
        });
        localStorage.setItem('patients', JSON.stringify(list));
        renderBoard();
    };

    window.toggleInlineEdit = (id, open) => {
        let list = JSON.parse(localStorage.getItem('patients'));
        list = list.map(p => p.id === id ? { ...p, isEditing: open } : p);
        localStorage.setItem('patients', JSON.stringify(list));
        renderBoard();
    };

    window.saveInlineEdit = (id) => {
        const newOp = document.getElementById(`edit-op-${id}`).value.trim();
        const newSub = document.getElementById(`edit-sub-${id}`).value.trim();
        const newHd = document.getElementById(`edit-hd-${id}`).value.trim();
        const newMemo = document.getElementById(`edit-memo-${id}`).value.trim();

        let list = JSON.parse(localStorage.getItem('patients'));
        list = list.map(p => {
            if (p.id === id) {
                p.op = newOp; p.memo = newMemo; p.isEditing = false;
                if (newSub.includes('/')) {
                    const parts = newSub.split('/');
                    const ageGender = parts[0].trim();
                    p.anes = parts[1].trim();
                    if (ageGender.toLowerCase().includes('m')) { p.gender = 'M'; p.age = ageGender.replace(/m/i, '').trim(); } 
                    else if (ageGender.toLowerCase().includes('f')) { p.gender = 'F'; p.age = ageGender.replace(/f/i, '').trim(); }
                }
                if (newHd.includes('|')) {
                    const hdParts = newHd.split('|');
                    p.hx = hdParts[0].trim() ? hdParts[0].split(',').map(s=>s.trim()) : [];
                    p.data = hdParts[1].trim() ? hdParts[1].split(',').map(s=>s.trim()) : [];
                } else {
                    p.hx = newHd ? newHd.split(',').map(s=>s.trim()) : []; p.data = [];
                }
            }
            return p;
        });
        localStorage.setItem('patients', JSON.stringify(list));
        renderBoard();
    };

    function exportToCSV() {
        const patients = JSON.parse(localStorage.getItem('patients')) || [];
        if (!patients.length) { alert('目前沒有手術資料可以匯出！'); return; }
        let csvContent = "\uFEFF"; csvContent += "房間,進度狀態,年齡,性別,科別,術式,麻醉方式,臨床警示,病史(Hx),數據(Data),備註\n";
        patients.forEach(p => {
            const hxStr = p.hx ? p.hx.join(';') : '';
            const dataStr = p.data ? p.data.join(';') : '';
            const riskStr = p.risk ? p.risk.join(';') : '';
            const cleanMemo = p.memo ? p.memo.replace(/,/g, '，') : '';
            const row = [`Room ${p.room}`, p.status, p.age, p.gender, p.dept || '自填', p.op, p.anes, riskStr, hxStr, dataStr, cleanMemo].join(",");
            csvContent += row + "\n";
        });
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        const today = new Date().toISOString().split('T')[0];
        link.setAttribute("href", url); link.setAttribute("download", `OR_手術紀錄_${today}.csv`);
        link.style.visibility = 'hidden'; document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }

    window.update = (id, s) => {
        let list = JSON.parse(localStorage.getItem('patients'));
        localStorage.setItem('patients', JSON.stringify(list.map(p=>p.id===id?{...p,status:s}:p)));
        renderBoard();
    };
    window.del = (id) => {
        let list = JSON.parse(localStorage.getItem('patients'));
        localStorage.setItem('patients', JSON.stringify(list.filter(p=>p.id!==id)));
        renderBoard();
    };

    initInputPage();
</script>
</body>
</html>

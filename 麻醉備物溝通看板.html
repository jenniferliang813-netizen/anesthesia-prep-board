<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>彰化秀傳麻醉備物溝通看板</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --ink: #1e3a5f;
      --ink-soft: #3b6fa0;
      --ink-2: #5a7593;
      --line: #d6dee8;
      --line-soft: #e8edf3;
      --warn: #c43a31;
      --warn-bg: #fdecea;
      --ok: #2e7d4f;
      --badge-wait: #c98a1a;
      --badge-current: #c43a31;
      --badge-done: #2e7d4f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "PingFang TC", "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--ink); padding: 10px; padding-bottom: 84px; font-size: 18px; line-height: 1.5; }

    .header { background: linear-gradient(135deg, #1e3a5f, #3b6fa0); color: white; border-radius: 12px; padding: 14px 18px; margin-bottom: 10px; box-shadow: 0 3px 10px rgba(30,58,95,0.15); }
    .header h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
    .header .sub { font-size: 16px; opacity: 0.88; margin-top: 2px; }

    .disclaimer { font-size: 14px; color: #5a6a82; background: #eef2f7; padding: 9px 12px; border-left: 4px solid var(--ink-soft); border-radius: 4px; margin-bottom: 12px; line-height: 1.5; }

    .group-bar { display: flex; gap: 8px; margin-bottom: 14px; }
    .group-bar button { flex: 1; min-height: 46px; border: 1.5px solid var(--line); background: white; color: var(--ink); font-size: 16px; font-weight: 600; border-radius: 10px; cursor: pointer; }
    .group-bar button.active { background: var(--ink); color: white; border-color: var(--ink); }

    .page { display: none; }
    .page.active { display: block; }

    .section-title { font-size: 16px; font-weight: 700; color: var(--ink); margin: 18px 0 8px 0; padding-left: 10px; border-left: 4px solid var(--ink-soft); }
    .section-title.first { margin-top: 4px; }

    .btn-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; align-items: center; }
    .btn-opt { min-height: 44px; background: white; border: 1.5px solid var(--line); padding: 8px 14px; border-radius: 8px; font-size: 16px; font-weight: 500; cursor: pointer; color: var(--ink); }
    .btn-opt.selected { background: var(--ink-soft); color: white; border-color: var(--ink-soft); }
    .btn-opt.multi.selected { background: var(--ink); border-color: var(--ink); }
    .btn-opt.risk-opt { border: 1.5px dashed var(--warn); color: var(--warn); font-weight: 600; }
    .btn-opt.risk-opt.selected { background: var(--warn); color: white; border-color: var(--warn); }

    .text-input { padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; font-size: 16px; background: white; min-height: 44px; color: var(--ink); }
    .text-input:focus { border-color: var(--ink-soft); outline: none; }
    .age-input { width: 110px; text-align: center; font-weight: 600; }
    .custom-op-input { width: 200px; border: 1.5px dashed var(--ink-soft); font-style: italic; }
    .custom-op-input:focus { border-style: solid; background: #eef5fb; }
    .memo-input { width: 100%; font-size: 16px; }
    .age-container { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }

    .preset-hint { display: none; font-size: 14px; color: var(--ink-soft); margin: 6px 0; padding: 8px 12px; background: #eef5fb; border-radius: 6px; border-left: 3px solid var(--ink-soft); }
    .preset-hint.show { display: block; }

    .prep-card { background: #fafcfd; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
    .prep-card.on { background: #eef5fb; border-color: var(--ink-soft); }
    .prep-card.nested { margin-left: 24px; border-left: 3px solid var(--ink-soft); position: relative; }
    .prep-card.nested::before { content: '↳ NB 配套'; position: absolute; top: -10px; left: 12px; background: var(--bg); padding: 0 6px; font-size: 12px; color: var(--ink-soft); font-weight: 600; }

    .voice-card { background: #fdf6e3; border: 1.5px solid #e0c47a; border-radius: 10px; padding: 12px; margin-bottom: 8px; }
    .voice-warn { font-size: 13px; color: #8b6b1f; background: #fff8e1; padding: 6px 10px; border-radius: 6px; margin-bottom: 10px; line-height: 1.5; }
    .voice-btn { width: 100%; min-height: 52px; background: #3b6fa0; color: white; border: none; border-radius: 10px; font-size: 17px; font-weight: 700; cursor: pointer; margin-bottom: 8px; }
    .voice-btn.recording { background: #c43a31; animation: voicePulse 1.2s ease-in-out infinite; }
    @keyframes voicePulse { 0%,100% { box-shadow: 0 0 0 0 rgba(196,58,49,0.5); } 50% { box-shadow: 0 0 0 10px rgba(196,58,49,0); } }
    .voice-status { font-size: 13px; color: var(--ink-2); margin-bottom: 6px; font-weight: 600; min-height: 18px; }
    .voice-text { width: 100%; min-height: 70px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; font-size: 16px; background: white; color: var(--ink); resize: vertical; font-family: inherit; line-height: 1.5; }
    .voice-text:focus { border-color: var(--ink-soft); outline: none; }
    .voice-actions { display: flex; gap: 8px; margin-top: 8px; }
    .voice-apply { flex: 1; min-height: 44px; background: var(--ok); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .voice-clear { min-height: 44px; padding: 0 18px; background: white; color: var(--ink); border: 1.5px solid var(--line); border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .voice-hint { font-size: 12px; color: var(--ink-2); margin-top: 8px; line-height: 1.5; }
    .voice-unsupported { background: #fdecea; color: var(--warn); padding: 10px 12px; border-radius: 8px; font-size: 14px; margin-bottom: 8px; border-left: 4px solid var(--warn); }
    .prep-toggle { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600; cursor: pointer; min-height: 36px; color: var(--ink); }
    .prep-toggle input { width: 22px; height: 22px; accent-color: var(--ink-soft); cursor: pointer; }
    .prep-body { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
    .prep-card.on .prep-body { display: block; }
    .prep-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .prep-row label { font-size: 15px; color: var(--ink-2); min-width: 96px; font-weight: 600; }
    .prep-sub-label { font-size: 14px; color: var(--ink-2); margin-bottom: 6px; font-weight: 600; }
    .ml-input { width: 84px; text-align: center; }
    .count-input { width: 70px; text-align: center; }

    .submit-btn { width: 100%; background: var(--ok); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 19px; font-weight: 700; margin-top: 20px; min-height: 54px; cursor: pointer; box-shadow: 0 2px 6px rgba(46,125,79,0.25); }
    .cancel-btn { width: 100%; background: #8a99a8; color: white; border: none; padding: 12px; border-radius: 10px; font-size: 16px; font-weight: 600; margin-top: 10px; min-height: 48px; cursor: pointer; }

    .op-placeholder { font-size: 14px; color: #889aae; font-style: italic; padding: 8px 0; }

    .board-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
    .board-top h2 { font-size: 20px; font-weight: 700; color: var(--ink); }
    .board-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .board-actions button { padding: 8px 14px; border: 1.5px solid var(--line); background: white; color: var(--ink); border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 40px; }
    .board-actions button.warn { color: var(--warn); border-color: var(--warn); }

    .room-block { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(30,58,95,0.08); border: 1px solid var(--line-soft); }
    .room-title { font-size: 22px; font-weight: 900; color: var(--ink); border-left: 6px solid var(--ink-soft); padding-left: 12px; margin-bottom: 12px; }
    .room-title .count { font-size: 14px; font-weight: 600; color: var(--ink-2); margin-left: 8px; }

    .case-card { background: white; border: 1.5px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .case-card:last-child { margin-bottom: 0; }
    .case-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
    .badge { padding: 5px 12px; border-radius: 999px; font-size: 14px; font-weight: 700; color: white; cursor: pointer; min-height: 30px; line-height: 1.4; border: none; }
    .badge.wait { background: var(--badge-wait); }
    .badge.current { background: var(--badge-current); }
    .badge.done { background: var(--badge-done); }
    .case-headline { font-size: 20px; font-weight: 700; color: var(--ink); flex: 1; min-width: 200px; word-break: break-word; }

    .room-jump { font-size: 16px; color: var(--warn); background: var(--warn-bg); padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; font-weight: 700; }

    .prep-block { background: #f7faff; border-left: 4px solid var(--ink-soft); padding: 10px 12px; border-radius: 6px; margin-bottom: 8px; font-size: 16px; line-height: 1.65; color: var(--ink); white-space: pre-wrap; word-break: break-word; }

    .reminders { font-size: 16px; font-weight: 700; color: var(--warn); margin-bottom: 8px; line-height: 1.5; }
    .anes-clear { display: inline-block; margin-left: 8px; font-size: 13px; padding: 4px 10px; background: var(--ok); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }

    .hxdata { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .hxdata-pill { font-size: 14px; padding: 7px 12px; background: #eef2f7; color: var(--ink); border-radius: 6px; cursor: pointer; border: none; font-weight: 600; min-height: 36px; }
    .hxdata-pill.open { background: var(--ink); color: white; }
    .hxdata-detail { font-size: 15px; color: var(--ink); background: #f4f6f9; padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; line-height: 1.5; word-break: break-word; }

    .memo-show { font-size: 15px; color: var(--ink-soft); font-style: italic; padding: 6px 0; word-break: break-word; }

    .case-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid var(--line-soft); }
    .case-actions button { font-size: 14px; padding: 8px 12px; border: 1.5px solid var(--line); background: white; color: var(--ink); border-radius: 6px; cursor: pointer; font-weight: 600; min-height: 40px; }
    .case-actions button.primary { color: white; background: var(--ink-soft); border-color: var(--ink-soft); }
    .case-actions button.warn { color: var(--warn); border-color: var(--warn); }
    .case-actions button.ok { color: white; background: var(--ok); border-color: var(--ok); }

    .empty-tip { text-align: center; color: #889aae; margin-top: 40px; font-size: 18px; padding: 40px 20px; background: white; border-radius: 12px; border: 1px dashed var(--line); }

    .nav { position: fixed; bottom: 0; left: 0; right: 0; height: 64px; background: white; border-top: 1px solid var(--line); display: flex; justify-content: space-around; align-items: center; z-index: 100; box-shadow: 0 -2px 8px rgba(0,0,0,0.05); }
    .nav-btn { background: none; border: none; font-size: 17px; font-weight: 700; color: #889aae; width: 50%; height: 100%; cursor: pointer; }
    .nav-btn.active { color: var(--ink); background: #eef5fb; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(30,58,95,0.55); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.show { display: flex; }
    .modal { background: white; border-radius: 12px; padding: 18px; width: 100%; max-width: 380px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
    .modal h3 { font-size: 18px; color: var(--ink); margin-bottom: 12px; }
    .modal .room-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .modal .room-grid button { min-width: 70px; min-height: 44px; padding: 8px 14px; border: 1.5px solid var(--line); background: white; border-radius: 8px; font-weight: 600; font-size: 16px; cursor: pointer; color: var(--ink); }
    .modal .room-grid button.current { border-color: var(--ink); background: var(--ink); color: white; }
    .modal .close { width: 100%; padding: 10px; background: #8a99a8; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; min-height: 44px; font-size: 16px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>彰化秀傳麻醉科</h1>
    <div class="sub">麻醉備物溝通看板</div>
  </div>
  <div class="disclaimer">
    本工具僅供彰化秀傳麻醉科 OR 內部備物溝通，不作為正式醫囑或病歷紀錄。實際藥物、劑量、濃度與給藥仍以麻醉醫師現場確認與院內規範為準。
  </div>
  <div class="group-bar" id="group-bar"></div>

  <div id="input-page" class="page active"></div>

  <div id="board-page" class="page">
    <div class="board-top">
      <h2>今日麻醉備物</h2>
      <div class="board-actions">
        <button onclick="exportCSV()">📥 匯出 CSV</button>
        <button class="warn" onclick="resetAll()">重置全天</button>
      </div>
    </div>
    <div id="board-container"></div>
  </div>

  <div class="nav">
    <button class="nav-btn active" id="nav-input" onclick="switchPage('input-page', this)">📱 新增 case</button>
    <button class="nav-btn" id="nav-board" onclick="switchPage('board-page', this); renderBoard();">📊 看板</button>
  </div>

  <div class="modal-overlay" id="room-change-modal">
    <div class="modal">
      <h3>跳房：選擇新房間</h3>
      <div class="room-grid" id="room-change-grid"></div>
      <button class="close" onclick="closeRoomChange()">取消</button>
    </div>
  </div>

<script>
'use strict';

const STORAGE_KEYS = {
  patients: 'anesthesiaPrep_patients',
  selectedRoomGroup: 'anesthesiaPrep_selectedRoomGroup',
  dataDate: 'anesthesiaPrep_dataDate'
};

const ROOM_GROUPS = {
  day_front: { label: '白班前段', rooms: ['1','2','5','6','13'] },
  day_back:  { label: '白班後段', rooms: ['7','8','9','11','13','18'] },
  duty:      { label: '值班',     rooms: ['1','2','5','6','7','8','9','11','13','18'] }
};

const OP_MAPPING = {
  'Ortho': ['TKR', 'THR', '膝關節鏡', 'RCT', 'radius', 'humerus', 'clavicle', 'femur', 'tibia', 'patella', 'ankle', 'pelvic', 'ROI', '骨水泥'],
  'ENT':   ['FESS', 'LMS', 'Tympanoplasty', 'Thyroid', 'tumor', 'tonsillectomy'],
  'NS':    ['Craniotomy', 'L spine', 'C spine', 'VP-shunt', 'RF', '骨水泥', 'brain tumor', 'pituitary tumor', 'ICP monitor'],
  'CS':    ['Lobectomy', 'wedge', 'segemenctectomy', '食道擴張', 'Esophagectomy', 'rib'],
  'CVS':   ['CABG', 'AVR', 'MVR', 'AV shunt', 'Varicose', 'TEVAR', 'AAA stent', 'type A', 'perm-cath'],
  'GYN':   ['TCR', 'ATH', 'LAVH', 'Myomectomy', 'D&C', 'C/S', 'staging', '卵巢手術'],
  'GU':    ['TURBT', 'RIRS', 'RRP', '膀胱鏡', 'URSL', 'TURP', 'vasetomy', 'hernia'],
  'PS':    ['Debridement', 'STSG', 'Flap', '整形'],
  'OS':    ['free flap', 'wide excision', 'zygoma fracture', '拔牙'],
  'GS':    ['LC', 'Appen', 'Hernia', '切胃', '切肝', 'port A', 'thyroid', 'parathyroid', 'GI RF'],
  'CRS':   ['Rt hemi', 'LAR', 'Anal fistula', 'hemorrhoid', '腸造口'],
  'BS':    ['BCS', 'Mastectomy'],
  'OPH':   ['眼科手術']
};

const OP_PRESETS = {
  'Lobectomy':       ['需 A-line', '需 DLT', 'ICU postop'],
  'wedge':           ['需 DLT'],
  'segemenctectomy': ['需 A-line', '需 DLT'],
  'Esophagectomy':   ['需 A-line', '需 DLT', '需粗 line', 'ICU postop'],
  '切肝':            ['需 A-line', '需 CVC'],
  '切胃':            ['需 A-line'],
  'CABG':            ['需 A-line', '需 CVC', 'ICU postop', '術後呼吸器'],
  'AVR':             ['需 A-line', '需 CVC', 'ICU postop', '術後呼吸器'],
  'MVR':             ['需 A-line', '需 CVC', 'ICU postop', '術後呼吸器'],
  'Craniotomy':      ['需 A-line', 'ICU postop'],
  'brain tumor':     ['需 A-line', 'ICU postop'],
  'pituitary tumor': ['需 A-line'],
  'LAR':             ['需 A-line'],
  'Rt hemi':         ['需 A-line'],
  'free flap':       ['需 A-line', '需 CVC']
};

const REMINDER_LIST = ['高風險', '尚未麻評', '需回問', '困難 airway', '需 A-line', '需 CVC', '需 DLT', '需 VL', '需 FOB', '需粗 line', 'ICU postop', '術後呼吸器'];
const HX_LIST = ['HTN','DM','CAD','Af','CVA','asthma','COPD','CKD','H/D','BMI','BW>100kg','肝硬化','Bokey','Plavix','NOAC','有停藥'];
const DATA_LIST = ['Hb < 10','Plt<10萬','eGFR<30','Na<130','K > 5.5','GOT>120','INR>1.5','EKG ok','STD','TWI','RBBB','CXR ok','cardiomegaly','infiltration','echo ok','EF<50','EF<40'];
const ANES_LIST = ['GA','SA','IVG','EA'];
const GENDER_LIST = ['M','F'];
const TURN_LIST = ['第1台','第2台','第3台','第4台','急診插入','其他'];
const BLOCK_TYPES = ['ESP','TAP','PENG','FIB','ACB','DSB','PECS','CCB','SCB','superior trunk','QL','ITP','FTB','popliteal','Caudal','其他'];
const DILUENTS = ['Normal saline','D5W'];
const STATUS_ORDER = ['待手術','手術中','已完成'];

let currentRoomGroup = loadRoomGroup();
let editingId = null;
const expandedHx = new Set();
const expandedData = new Set();
let pendingRoomChangeId = null;

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function loadPatients() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEYS.patients)) || []; }
  catch(e) { return []; }
}
function savePatients(list) {
  localStorage.setItem(STORAGE_KEYS.patients, JSON.stringify(list));
  localStorage.setItem(STORAGE_KEYS.dataDate, todayStr());
}
function checkAndPurgeStaleData() {
  const storedDate = localStorage.getItem(STORAGE_KEYS.dataDate);
  if (storedDate && storedDate !== todayStr()) {
    localStorage.removeItem(STORAGE_KEYS.patients);
  }
  localStorage.setItem(STORAGE_KEYS.dataDate, todayStr());
}
function scheduleNightlyPurge() {
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 0, 0);
  if (next <= now) next.setDate(next.getDate() + 1);
  const ms = next.getTime() - now.getTime();
  setTimeout(() => {
    localStorage.removeItem(STORAGE_KEYS.patients);
    localStorage.setItem(STORAGE_KEYS.dataDate, todayStr());
    expandedHx.clear(); expandedData.clear();
    if (document.getElementById('board-page').classList.contains('active')) renderBoard();
    try { alert('已自動清除今日資料（23:59 排程）'); } catch(e) {}
    scheduleNightlyPurge();
  }, ms);
}

function loadRoomGroup() {
  return localStorage.getItem(STORAGE_KEYS.selectedRoomGroup) || 'day_front';
}
function saveRoomGroup(g) {
  localStorage.setItem(STORAGE_KEYS.selectedRoomGroup, g);
}

function renderGroupBar() {
  const bar = document.getElementById('group-bar');
  bar.innerHTML = '';
  Object.entries(ROOM_GROUPS).forEach(([key, cfg]) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = cfg.label;
    if (key === currentRoomGroup) btn.classList.add('active');
    btn.onclick = () => {
      currentRoomGroup = key;
      saveRoomGroup(key);
      renderGroupBar();
      renderRoomButtons();
      if (document.getElementById('board-page').classList.contains('active')) renderBoard();
    };
    bar.appendChild(btn);
  });
}

function renderRoomButtons() {
  const container = document.getElementById('field-room');
  if (!container) return;
  const rooms = ROOM_GROUPS[currentRoomGroup].rooms;
  const prevBtn = container.querySelector('.btn-opt.selected');
  const prevSelected = prevBtn ? prevBtn.dataset.value : '';
  container.innerHTML = '';
  rooms.forEach(r => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn-opt single';
    btn.dataset.value = r;
    btn.textContent = 'R' + r;
    if (r === prevSelected) btn.classList.add('selected');
    btn.onclick = () => {
      container.querySelectorAll('.btn-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    };
    container.appendChild(btn);
  });
}

function initInputPage() {
  const page = document.getElementById('input-page');
  page.innerHTML = `
    <div class="section-title first">Room（依班別過濾）</div>
    <div class="btn-group" id="field-room"></div>

    <div class="section-title">第幾台</div>
    <div class="btn-group" id="field-turn"></div>
    <input type="text" id="turn-custom" class="text-input" placeholder="✎ 其他（自填）" maxlength="20" style="display:none; width:220px; margin-top:6px;">

    <div class="section-title">年齡 / 性別</div>
    <div class="age-container">

function createBtns(id, list, isMulti, isRisk, onAfter) {
  const container = document.getElementById('field-' + id);
  if (!container) return;
  container.innerHTML = '';
  list.forEach(opt => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn-opt ' + (isMulti ? 'multi' : 'single') + (isRisk ? ' risk-opt' : '');
    btn.textContent = opt;
    btn.dataset.value = opt;
    btn.onclick = () => {
      if (!isMulti) container.querySelectorAll('.btn-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.toggle('selected');
      if (id === 'dept') updateOpButtons(opt);
      if (onAfter) onAfter(opt, btn);
    };
    container.appendChild(btn);
  });
}

function updateOpButtons(dept) {
  const container = document.getElementById('field-op');
  container.innerHTML = '';
  (OP_MAPPING[dept] || []).forEach(name => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn-opt single';
    btn.dataset.value = name;
    btn.textContent = name;
    btn.onclick = () => {
      container.querySelectorAll('.btn-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      const customEl = document.getElementById('custom-op');
      if (customEl) customEl.value = '';
      applyOpPreset(name);
    };
    container.appendChild(btn);
  });
  const input = document.createElement('input');
  input.type = 'text';
  input.id = 'custom-op';
  input.className = 'text-input custom-op-input';
  input.placeholder = '✎ 自填術式';
  input.maxLength = 40;
  input.oninput = () => {
    container.querySelectorAll('.btn-opt').forEach(b => b.classList.remove('selected'));
    hidePresetHint();
  };
  container.appendChild(input);
  hidePresetHint();
}

function applyOpPreset(op) {
  const preset = OP_PRESETS[op];
  hidePresetHint();
  if (!preset || !preset.length) return;
  document.querySelectorAll('#field-reminder .btn-opt').forEach(b => {
    if (preset.indexOf(b.dataset.value) >= 0 && !b.classList.contains('selected')) {
      b.classList.add('selected');
    }
  });
  const hint = document.getElementById('preset-hint');
  hint.textContent = '💡 已自動帶入：' + preset.join('、') + '（不要的請於下方特殊提醒取消）';
  hint.classList.add('show');
}
function hidePresetHint() {
  const hint = document.getElementById('preset-hint');
  if (hint) hint.classList.remove('show');
}

function getSingleSelected(id) {
  const btn = document.querySelector('#field-' + id + ' .btn-opt.selected');
  return btn ? btn.dataset.value : '';
}
function getMultiSelected(id) {
  return Array.from(document.querySelectorAll('#field-' + id + ' .btn-opt.selected')).map(b => b.dataset.value);
}
function selectBtn(id, val) {
  if (!val) return;
  const btns = document.querySelectorAll('#field-' + id + ' .btn-opt');
  let found = false;
  btns.forEach(b => { if (b.dataset.value === val) found = true; });
  if (!found) return;
  btns.forEach(b => b.classList.remove('selected'));
  btns.forEach(b => { if (b.dataset.value === val) b.classList.add('selected'); });
}
function selectBtnMulti(id, val) {
  if (!val) return;
  document.querySelectorAll('#field-' + id + ' .btn-opt').forEach(b => {
    if (b.dataset.value === val) b.classList.add('selected');
  });
}

function readForm() {
  const room = getSingleSelected('room');
  const turn = getSingleSelected('turn');
  const turnCustom = document.getElementById('turn-custom').value.trim().slice(0,20);
  const finalTurn = (turn === '其他') ? (turnCustom || '其他') : turn;

  const customOpEl = document.getElementById('custom-op');
  const customOp = customOpEl ? customOpEl.value.trim().slice(0,40) : '';
  const op = customOp || getSingleSelected('op');

  return {
    room,
    turn: finalTurn,
    age: document.getElementById('age-input').value.trim().slice(0,3),
    gender: getSingleSelected('gender'),
    dept: getSingleSelected('dept'),
    op,
    anes: getSingleSelected('anes'),
    airway: {
      lma: document.getElementById('chk-lma').checked,
      nonKinkingEndo: document.getElementById('chk-nke').checked,
      nasalTube: document.getElementById('chk-nasal').checked
    },
    monitoring: {
      bis: document.getElementById('chk-bis').checked
    },
    analgesia: {
      nerveBlock: {
        enabled: document.getElementById('chk-nb').checked,
        blockType: getSingleSelected('nb-type'),
        perSyringe: {
          ropivacaineMl: document.getElementById('nb-ropi').value.trim(),
          decadronMl: document.getElementById('nb-deca').value.trim(),
          epinephrineMl: document.getElementById('nb-epi').value.trim(),
          diluentType: getSingleSelected('nb-diluent'),
          diluteToMl: document.getElementById('nb-dilute').value.trim()
        },
        syringeCount: document.getElementById('nb-count').value.trim()
      },
      testing: {
        enabled: document.getElementById('chk-testing').checked,
        perSyringe: {
          lidocaineMl: document.getElementById('t-lido').value.trim(),
          diluentType: getSingleSelected('t-diluent'),
          diluteToMl: document.getElementById('t-dilute').value.trim()
        },
        syringeCount: document.getElementById('t-count').value.trim()
      },
      spinalMorphine: document.getElementById('chk-spinal').checked,
      dynastat: document.getElementById('chk-dynastat').checked,
      acetamol: document.getElementById('chk-acetamol').checked,
      epiduralPCA: document.getElementById('chk-epca').checked,
      ivpca: document.getElementById('chk-ivpca').checked
    },
    reminders: getMultiSelected('reminder'),
    hx: getMultiSelected('hx'),
    data: getMultiSelected('data'),
    memo: document.getElementById('memo-input').value.trim().slice(0,80)
  };
}

function submitPatient() {
  const form = readForm();
  if (!form.room) { alert('請至少選擇 Room！'); return; }

  const list = loadPatients();
  if (editingId != null) {
    const idx = list.findIndex(p => p.id === editingId);
    if (idx >= 0) {
      const existing = list[idx];
      list[idx] = Object.assign({}, existing, {
        currentRoom: form.room,
        turn: form.turn,
        age: form.age,
        gender: form.gender,
        dept: form.dept,
        op: form.op,
        anes: form.anes,
        airway: form.airway,
        monitoring: form.monitoring,
        analgesia: form.analgesia,
        reminders: form.reminders,
        hx: form.hx,
        data: form.data,
        memo: form.memo
      });
    }
    editingId = null;
    document.getElementById('submit-btn').textContent = '送出到看板';
    document.getElementById('cancel-edit-btn').style.display = 'none';
    savePatients(list);
    resetForm();
    switchToBoardTab();
  } else {
    const newCase = {
      id: Date.now(),
      date: todayStr(),
      roomGroup: currentRoomGroup,
      originalRoom: form.room,
      currentRoom: form.room,
      turn: form.turn,
      age: form.age,
      gender: form.gender,
      dept: form.dept,
      op: form.op,
      anes: form.anes,
      airway: form.airway,
      monitoring: form.monitoring,
      analgesia: form.analgesia,
      reminders: form.reminders,
      hx: form.hx,
      data: form.data,
      memo: form.memo,
      status: '待手術',
      createdAt: Date.now()
    };
    list.push(newCase);
    savePatients(list);
    resetForm();
    alert('R' + newCase.currentRoom + (newCase.turn ? '｜' + newCase.turn : '') + ' 新增成功！');
  }
}

function resetForm() {
  document.getElementById('age-input').value = '';
  document.getElementById('memo-input').value = '';
  document.getElementById('turn-custom').value = '';
  document.getElementById('turn-custom').style.display = 'none';
  document.querySelectorAll('#input-page .btn-opt').forEach(b => b.classList.remove('selected'));
  document.getElementById('field-op').innerHTML = '<div class="op-placeholder">💡 請先點選上方「科別」</div>';
  selectBtn('anes', 'GA');
  ['lma','nke','nasal','bis','nb','testing','spinal','dynastat','acetamol','epca','ivpca'].forEach(k => {
    const el = document.getElementById('chk-' + k);
    if (el) el.checked = false;
    const card = document.getElementById('card-' + k);
    if (card) card.classList.remove('on');
  });
  ['nb-ropi','nb-deca','nb-epi','nb-dilute','nb-count','t-lido','t-dilute','t-count'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });

function cancelEdit() {
  editingId = null;
  document.getElementById('submit-btn').textContent = '送出到看板';
  document.getElementById('cancel-edit-btn').style.display = 'none';
  resetForm();
}

function isStandardTurn(t) {
  return ['第1台','第2台','第3台','第4台','急診插入'].indexOf(t) >= 0;
}

function startEdit(id) {
  const list = loadPatients();
  const p = list.find(x => x.id === id);
  if (!p) return;
  editingId = id;
  resetForm();

  if (ROOM_GROUPS[currentRoomGroup].rooms.indexOf(p.currentRoom) < 0) {
    if (p.roomGroup && ROOM_GROUPS[p.roomGroup] && ROOM_GROUPS[p.roomGroup].rooms.indexOf(p.currentRoom) >= 0) {
      currentRoomGroup = p.roomGroup;
    } else {
      currentRoomGroup = 'duty';
    }
    saveRoomGroup(currentRoomGroup);
    renderGroupBar();
  }
  renderRoomButtons();
  selectBtn('room', p.currentRoom);

  if (isStandardTurn(p.turn)) {
    selectBtn('turn', p.turn);
  } else if (p.turn) {
    selectBtn('turn', '其他');
    const custom = document.getElementById('turn-custom');
    custom.style.display = 'inline-block';
    custom.value = p.turn;
  }

  document.getElementById('age-input').value = p.age || '';
  selectBtn('gender', p.gender);

  if (p.dept) {
    selectBtn('dept', p.dept);
    updateOpButtons(p.dept);
    if (p.op) {
      const matched = (OP_MAPPING[p.dept] || []).indexOf(p.op) >= 0;
      if (matched) selectBtn('op', p.op);
      else {
        const customOp = document.getElementById('custom-op');
        if (customOp) customOp.value = p.op;
      }
    }
  }
  selectBtn('anes', p.anes);

  if (p.airway) {
    if (p.airway.lma) { document.getElementById('chk-lma').checked = true; document.getElementById('card-lma').classList.add('on'); }
    if (p.airway.nonKinkingEndo) { document.getElementById('chk-nke').checked = true; document.getElementById('card-nke').classList.add('on'); }
    if (p.airway.nasalTube) { document.getElementById('chk-nasal').checked = true; document.getElementById('card-nasal').classList.add('on'); }
  }
  if (p.monitoring && p.monitoring.bis) {
    document.getElementById('chk-bis').checked = true;
    document.getElementById('card-bis').classList.add('on');
  }

  const a = p.analgesia || {};
  if (a.nerveBlock && a.nerveBlock.enabled) {
    document.getElementById('chk-nb').checked = true;
    document.getElementById('card-nb').classList.add('on');
    if (a.nerveBlock.blockType) selectBtn('nb-type', a.nerveBlock.blockType);
    const ps = a.nerveBlock.perSyringe || {};
    document.getElementById('nb-ropi').value = ps.ropivacaineMl || '';
    document.getElementById('nb-deca').value = ps.decadronMl || '';
    document.getElementById('nb-epi').value = ps.epinephrineMl || '';
    if (ps.diluentType) selectBtn('nb-diluent', ps.diluentType);
    document.getElementById('nb-dilute').value = ps.diluteToMl || '';
    document.getElementById('nb-count').value = a.nerveBlock.syringeCount || '';
  }
  if (a.testing && a.testing.enabled) {
    document.getElementById('chk-testing').checked = true;
    document.getElementById('card-testing').classList.add('on');
    const ps = a.testing.perSyringe || {};
    document.getElementById('t-lido').value = ps.lidocaineMl || '';
    if (ps.diluentType) selectBtn('t-diluent', ps.diluentType);
    document.getElementById('t-dilute').value = ps.diluteToMl || '';
    document.getElementById('t-count').value = a.testing.syringeCount || '';
  }
  const simple = [['spinal','spinalMorphine'],['dynastat','dynastat'],['acetamol','acetamol'],['epca','epiduralPCA'],['ivpca','ivpca']];
  simple.forEach(pair => {
    if (a[pair[1]]) {
      document.getElementById('chk-' + pair[0]).checked = true;
      document.getElementById('card-' + pair[0]).classList.add('on');
    }
  });

  (p.reminders || []).forEach(r => selectBtnMulti('reminder', r));
  (p.hx || []).forEach(r => selectBtnMulti('hx', r));
  (p.data || []).forEach(r => selectBtnMulti('data', r));
  document.getElementById('memo-input').value = p.memo || '';

  document.getElementById('submit-btn').textContent = '更新此 case';
  document.getElementById('cancel-edit-btn').style.display = 'block';

  document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('input-page').classList.add('active');
  document.getElementById('nav-input').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderBoard() {
  const container = document.getElementById('board-container');
  container.innerHTML = '';
  const all = loadPatients();
  if (!all.length) {
    const tip = document.createElement('div');
    tip.className = 'empty-tip';
    tip.textContent = '📭 目前尚無 case 資料';
    container.appendChild(tip);
    return;
  }
  const allowedRooms = ROOM_GROUPS[currentRoomGroup].rooms;
  const activeRooms = allowedRooms.filter(r => all.some(p => p.currentRoom === r));
  if (!activeRooms.length) {
    const tip = document.createElement('div');
    tip.className = 'empty-tip';
    tip.textContent = '📭 ' + ROOM_GROUPS[currentRoomGroup].label + ' 目前無 case';
    container.appendChild(tip);
    return;
  }
  const TURN_SORT = ['第1台','第2台','第3台','第4台','急診插入'];
  function turnSortKey(t) {
    const i = TURN_SORT.indexOf(t);
    return i === -1 ? 99 : i;
  }
  activeRooms.forEach(roomNum => {
    const cases = all.filter(p => p.currentRoom === roomNum);
    cases.sort((a,b) => {
      const ka = turnSortKey(a.turn), kb = turnSortKey(b.turn);
      if (ka !== kb) return ka - kb;
      return (a.createdAt || a.id) - (b.createdAt || b.id);
    });
    const block = document.createElement('div');
    block.className = 'room-block';
    const title = document.createElement('div');
    title.className = 'room-title';
    const tNum = document.createElement('span');
    tNum.textContent = 'Room ' + roomNum;
    title.appendChild(tNum);
    const tCount = document.createElement('span');
    tCount.className = 'count';
    tCount.textContent = '（' + cases.length + ' case）';
    title.appendChild(tCount);
    block.appendChild(title);
    cases.forEach(c => block.appendChild(renderCase(c)));
    container.appendChild(block);
  });
}

function renderCase(p) {
  const card = document.createElement('div');
  card.className = 'case-card';

  const head = document.createElement('div');
  head.className = 'case-head';
  const statusKey = p.status === '手術中' ? 'current' : (p.status === '已完成' ? 'done' : 'wait');
  const badge = document.createElement('button');
  badge.type = 'button';
  badge.className = 'badge ' + statusKey;
  badge.textContent = p.status || '待手術';
  badge.title = '點擊切換狀態';
  badge.onclick = () => cycleStatus(p.id);
  head.appendChild(badge);

  const headline = document.createElement('div');
  headline.className = 'case-headline';
  const headParts = [];
  if (p.turn) headParts.push(p.turn);
  if (p.dept) headParts.push(p.dept);
  if (p.op) headParts.push(p.op);
  if (p.anes) headParts.push(p.anes);
  const ag = (p.age ? p.age + 'y' : '') + (p.gender || '');
  if (ag) headParts.push(ag);
  headline.textContent = headParts.join('｜') || '（未填）';
  head.appendChild(headline);
  card.appendChild(head);

  if (p.originalRoom && p.originalRoom !== p.currentRoom) {
    const jump = document.createElement('div');
    jump.className = 'room-jump';
    jump.textContent = '⚠️ 跳房：R' + p.originalRoom + ' → R' + p.currentRoom;
    card.appendChild(jump);
  }

  const prepLines = buildPrepLines(p);
  if (prepLines.length) {
    const prep = document.createElement('div');
    prep.className = 'prep-block';
    prep.textContent = prepLines.join('\n');
    card.appendChild(prep);
  }

  if (p.reminders && p.reminders.length) {
    const r = document.createElement('div');
    r.className = 'reminders';
    r.textContent = '⚠️ ' + p.reminders.join('、');
    if (p.reminders.indexOf('尚未麻評') >= 0) {
      const clr = document.createElement('button');
      clr.type = 'button';
      clr.className = 'anes-clear';
      clr.textContent = '✓ 已評估';
      clr.onclick = () => clearAnesReview(p.id);
      r.appendChild(clr);
    }
    card.appendChild(r);
  }

  if ((p.hx && p.hx.length) || (p.data && p.data.length)) {
    const row = document.createElement('div');
    row.className = 'hxdata';
    if (p.hx && p.hx.length) {
      const pill = document.createElement('button');
      pill.type = 'button';
      pill.className = 'hxdata-pill' + (expandedHx.has(p.id) ? ' open' : '');
      pill.textContent = (expandedHx.has(p.id) ? '▾' : '▸') + ' Hx (' + p.hx.length + ')';
      pill.onclick = () => {
        if (expandedHx.has(p.id)) expandedHx.delete(p.id); else expandedHx.add(p.id);
        renderBoard();
      };
      row.appendChild(pill);
    }
    if (p.data && p.data.length) {
      const pill = document.createElement('button');
      pill.type = 'button';
      pill.className = 'hxdata-pill' + (expandedData.has(p.id) ? ' open' : '');
      pill.textContent = (expandedData.has(p.id) ? '▾' : '▸') + ' Data (' + p.data.length + ')';
      pill.onclick = () => {
        if (expandedData.has(p.id)) expandedData.delete(p.id); else expandedData.add(p.id);
        renderBoard();
      };
      row.appendChild(pill);
    }
    card.appendChild(row);

    if (expandedHx.has(p.id) && p.hx && p.hx.length) {
      const d = document.createElement('div');
      d.className = 'hxdata-detail';
      d.textContent = 'Hx：' + p.hx.join('、');
      card.appendChild(d);
    }
    if (expandedData.has(p.id) && p.data && p.data.length) {
      const d = document.createElement('div');
      d.className = 'hxdata-detail';
      d.textContent = 'Data：' + p.data.join('、');
      card.appendChild(d);
    }
  }

  if (p.memo) {
    const m = document.createElement('div');
    m.className = 'memo-show';
    m.textContent = '✍ ' + p.memo;
    card.appendChild(m);
  }

  const actions = document.createElement('div');
  actions.className = 'case-actions';
  if (p.status === '待手術') {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'primary';
    b.textContent = '▶ 進入';
    b.onclick = () => setStatus(p.id, '手術中');
    actions.appendChild(b);
  }
  if (p.status === '手術中') {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'ok';
    b.textContent = '✓ 完成';
    b.onclick = () => setStatus(p.id, '已完成');
    actions.appendChild(b);
  }
  const jump = document.createElement('button');
  jump.type = 'button';
  jump.textContent = '🔀 跳房';
  jump.onclick = () => openRoomChange(p.id);
  actions.appendChild(jump);
  const ed = document.createElement('button');
  ed.type = 'button';
  ed.textContent = '✎ 編輯';
  ed.onclick = () => startEdit(p.id);
  actions.appendChild(ed);
  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'warn';
  del.textContent = '刪除';
  del.onclick = () => { if (confirm('確定刪除此 case？')) deleteCase(p.id); };
  actions.appendChild(del);
  card.appendChild(actions);

  return card;
}

function buildPrepLines(p) {
  const lines = [];
  const a = p.analgesia || {};

  if (p.airway) {
    const aw = [];
    if (p.airway.lma) aw.push('LMA');
    if (p.airway.nonKinkingEndo) aw.push('Non-kinking endo');
    if (p.airway.nasalTube) aw.push('鼻管');
    if (aw.length) lines.push('Airway：' + aw.join('、'));
  }
  if (p.monitoring && p.monitoring.bis) {
    lines.push('Monitoring：BIS');
  }

  if (a.nerveBlock && a.nerveBlock.enabled) {
    const nb = a.nerveBlock;
    lines.push(nb.blockType ? ('NB：' + nb.blockType + ' block') : 'NB');
    const ps = nb.perSyringe || {};
    const drugs = [];
    if (ps.ropivacaineMl) drugs.push('Ropivacaine ' + ps.ropivacaineMl + ' ml');
    if (ps.decadronMl) drugs.push('Decadron ' + ps.decadronMl + ' ml');
    if (ps.epinephrineMl) drugs.push('Epinephrine ' + ps.epinephrineMl + ' ml');
    if (drugs.length) lines.push(drugs.join(' + '));
    const parts = [];
    if (ps.diluentType && ps.diluteToMl) parts.push('用 ' + ps.diluentType + ' 稀釋至 ' + ps.diluteToMl + ' ml');
    else if (ps.diluteToMl) parts.push('稀釋至 ' + ps.diluteToMl + ' ml');
    else if (ps.diluentType) parts.push('用 ' + ps.diluentType + ' 稀釋');
    if (nb.syringeCount) parts.push('抽 ' + nb.syringeCount + ' 隻');
    if (parts.length) lines.push(parts.join('，'));
  }

  if (a.testing && a.testing.enabled) {
    const t = a.testing;
    const ps = t.perSyringe || {};
    lines.push('Testing：');
    if (ps.lidocaineMl) lines.push('Lidocaine ' + ps.lidocaineMl + ' ml');
    const parts = [];
    if (ps.diluentType && ps.diluteToMl) parts.push('用 ' + ps.diluentType + ' 稀釋至 ' + ps.diluteToMl + ' ml');
    else if (ps.diluteToMl) parts.push('稀釋至 ' + ps.diluteToMl + ' ml');
    else if (ps.diluentType) parts.push('用 ' + ps.diluentType + ' 稀釋');
    if (t.syringeCount) parts.push('抽 ' + t.syringeCount + ' 隻');
    if (parts.length) lines.push(parts.join('，'));
  }

  if (a.spinalMorphine) lines.push('Spinal morphine');

  const pcaItems = [];
  if (a.epiduralPCA) pcaItems.push('Epidural PCA');
  if (a.ivpca) pcaItems.push('IVPCA');
  if (pcaItems.length) lines.push('PCA：' + pcaItems.join('、'));

  const sysItems = [];
  if (a.dynastat) sysItems.push('Dynastat');
  if (a.acetamol) sysItems.push('Acetamol');
  if (sysItems.length) lines.push('Systemic analgesics：' + sysItems.join('、'));

  return lines;
}

function cycleStatus(id) {
  const list = loadPatients();
  const idx = list.findIndex(p => p.id === id);
  if (idx < 0) return;
  const cur = list[idx].status || '待手術';
  const ni = (STATUS_ORDER.indexOf(cur) + 1) % STATUS_ORDER.length;
  list[idx].status = STATUS_ORDER[ni];
  savePatients(list);
  renderBoard();
}
function setStatus(id, s) {
  const list = loadPatients();
  const idx = list.findIndex(p => p.id === id);
  if (idx >= 0) {
    list[idx].status = s;
    savePatients(list);
    renderBoard();
  }
}
function deleteCase(id) {
  const list = loadPatients().filter(p => p.id !== id);
  savePatients(list);
  expandedHx.delete(id); expandedData.delete(id);
  renderBoard();
}
function clearAnesReview(id) {
  const list = loadPatients();
  const idx = list.findIndex(p => p.id === id);
  if (idx >= 0) {
    list[idx].reminders = (list[idx].reminders || []).filter(r => r !== '尚未麻評');
    savePatients(list);
    renderBoard();
  }
}

function openRoomChange(id) {
  pendingRoomChangeId = id;
  const list = loadPatients();
  const p = list.find(x => x.id === id);
  const grid = document.getElementById('room-change-grid');
  grid.innerHTML = '';
  const allowed = new Set(ROOM_GROUPS[currentRoomGroup].rooms);
  if (p && p.originalRoom) allowed.add(p.originalRoom);
  if (p && p.currentRoom) allowed.add(p.currentRoom);
  const rooms = Array.from(allowed).sort((a,b) => Number(a) - Number(b));
  rooms.forEach(r => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = 'R' + r;
    if (p && r === p.currentRoom) btn.classList.add('current');
    btn.onclick = () => doRoomChange(r);
    grid.appendChild(btn);
  });
  document.getElementById('room-change-modal').classList.add('show');
}
function closeRoomChange() {
  pendingRoomChangeId = null;
  document.getElementById('room-change-modal').classList.remove('show');
}
function doRoomChange(newRoom) {
  if (pendingRoomChangeId == null) return;
  const list = loadPatients();
  const idx = list.findIndex(p => p.id === pendingRoomChangeId);
  if (idx >= 0) {
    list[idx].currentRoom = newRoom;
    savePatients(list);
  }
  closeRoomChange();
  renderBoard();
}

function csvCell(v) {
  if (v == null) v = '';
  v = String(v);
  if (/[",\n\r]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
  return v;
}
function buildNBPerSyringe(nb) {
  const ps = (nb && nb.perSyringe) || {};
  const drugs = [];
  if (ps.ropivacaineMl) drugs.push('Ropivacaine ' + ps.ropivacaineMl + ' ml');
  if (ps.decadronMl) drugs.push('Decadron ' + ps.decadronMl + ' ml');
  if (ps.epinephrineMl) drugs.push('Epinephrine ' + ps.epinephrineMl + ' ml');
  return drugs.join(' + ');
}
function buildTestingSummary(t) {
  if (!t || !t.enabled) return '';
  const ps = t.perSyringe || {};
  const parts = [];
  if (ps.lidocaineMl) parts.push('Lidocaine ' + ps.lidocaineMl + ' ml');
  if (ps.diluentType && ps.diluteToMl) parts.push('用 ' + ps.diluentType + ' 稀釋至 ' + ps.diluteToMl + ' ml');
  if (t.syringeCount) parts.push('抽 ' + t.syringeCount + ' 隻');
  return parts.join('，');
}

      (function(){

        return aw.join('；');
      })(),

      nb.enabled ? buildNBPerSyringe(nb) : '',

      a.acetamol ? 'V' : '',

function parseVoiceText(text) {
  const actions = { reminders: [], analgesia: {}, nb: {} };
  const t = text;

  if (/(備|打|要|加)\s*[Aa]\s*-?\s*line|arterial\s*line|動脈導管/i.test(t)) actions.reminders.push('需 A-line');
  if (/(備|打|要|加)\s*CVC|central\s*line|中央靜脈|中心靜脈/i.test(t)) actions.reminders.push('需 CVC');
  if (/粗\s*line|粗\s*IV|large\s*bore/i.test(t)) actions.reminders.push('需粗 line');
  if (/DLT|double\s*lumen|雙腔管/i.test(t)) actions.reminders.push('需 DLT');
  if (/\bVL\b|video\s*laryngoscope|影像\s*喉頭鏡/i.test(t)) actions.reminders.push('需 VL');
  if (/FOB|fiber|fibre|支氣管鏡|纖維鏡/i.test(t)) actions.reminders.push('需 FOB');
  if (/困難\s*airway|困難\s*插管|difficult\s*airway/i.test(t)) {
    actions.reminders.push('困難 airway');
    actions.reminders.push('需 FOB');
  }
  if (/ICU\s*postop|術後\s*ICU|送\s*ICU/i.test(t)) actions.reminders.push('ICU postop');
  if (/術後\s*呼吸器|post[- ]?op\s*ventilator/i.test(t)) actions.reminders.push('術後呼吸器');

  if (/IVPCA|IV\s*PCA/i.test(t)) actions.analgesia.ivpca = true;
  if (/epidural\s*PCA|硬膜外\s*PCA/i.test(t)) actions.analgesia.epiduralPCA = true;
  if (/Dynastat/i.test(t)) actions.analgesia.dynastat = true;
  if (/Acetamol|acetaminophen|paracetamol/i.test(t)) actions.analgesia.acetamol = true;
  if (/spinal\s*morphine|脊髓\s*嗎啡/i.test(t)) actions.analgesia.spinalMorphine = true;

  const btMatch = t.match(/\b(ESP|TAP|PENG|FIB|ACB|DSB|PECS|CCB|SCB|QL|ITP|FTB|ICNB|popliteal|caudal|superior\s*trunk)\b/i);
  if (btMatch) {
    actions.nb.enabled = true;
    let raw = btMatch[1].trim();
    if (/superior\s*trunk/i.test(raw)) raw = 'superior trunk';
    else if (/popliteal/i.test(raw)) raw = 'popliteal';
    else if (/caudal/i.test(raw)) raw = 'Caudal';
    else raw = raw.toUpperCase();
    actions.nb.blockType = (BLOCK_TYPES.indexOf(raw) >= 0) ? raw : '其他';
  }

  const ropi = t.match(/Ropi(?:vacaine)?\s*(\d+(?:\.\d+)?)/i);
  if (ropi) { actions.nb.enabled = true; actions.nb.ropivacaineMl = ropi[1]; }
  const deca = t.match(/Decadron\s*(\d+(?:\.\d+)?)/i);
  if (deca) { actions.nb.enabled = true; actions.nb.decadronMl = deca[1]; }
  const epi = t.match(/Epi(?:nephrine)?\s*(\d+(?:\.\d+)?)/i);
  if (epi) { actions.nb.enabled = true; actions.nb.epinephrineMl = epi[1]; }

  if (/D5W|5%\s*dextrose|葡萄糖水/i.test(t)) actions.nb.diluentType = 'D5W';
  else if (/Normal\s*saline|N\/S|\bNS\b|生理\s*食鹽水|saline/i.test(t)) actions.nb.diluentType = 'Normal saline';

  const diluteTo = t.match(/(?:稀釋\s*至|到|至)\s*(\d+(?:\.\d+)?)\s*(?:ml|毫升)?/i);
  if (diluteTo) { actions.nb.enabled = true; actions.nb.diluteToMl = diluteTo[1]; }

  let cnt = t.match(/抽\s*(\d+)\s*(?:隻|支|劑)/);
  if (!cnt) cnt = t.match(/(\d+)\s*(?:隻|支)/);
  if (cnt) { actions.nb.enabled = true; actions.nb.syringeCount = cnt[1]; }

  return actions;
}

function setupVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const card = document.getElementById('voice-card');
  const unsupportedTip = document.getElementById('voice-unsupported');
  if (!SR) {
    if (card) card.style.display = 'none';
    if (unsupportedTip) unsupportedTip.style.display = 'block';
    return;
  }
  const recog = new SR();
  recog.lang = 'zh-TW';
  recog.interimResults = true;
  recog.continuous = false;
  let active = false;
  let baseText = '';

  const btn = document.getElementById('voice-btn');
  const status = document.getElementById('voice-status');
  const textArea = document.getElementById('voice-text');

  btn.addEventListener('click', () => {
    if (active) { try { recog.stop(); } catch(e) {} return; }
    baseText = textArea.value.trim();
    try { recog.start(); } catch(e) { status.textContent = '無法啟動：' + e.message; }
  });

  recog.onstart = () => {
    active = true;
    btn.textContent = '⏹ 停止錄音';
    btn.classList.add('recording');
    status.textContent = '🔴 錄音中…（再按一次停止）';
  };
  recog.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const tx = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += tx;
      else interim += tx;
    }
    const merged = (baseText + (baseText && (final || interim) ? ' ' : '') + final + interim).slice(0, 400);
    textArea.value = merged;
    if (final) baseText = merged;
  };
  recog.onerror = (e) => {
    status.textContent = '⚠️ 辨識錯誤：' + (e.error || '未知');
  };
  recog.onend = () => {
    active = false;
    btn.textContent = '🎙 開始語音輸入';
    btn.classList.remove('recording');
    if (!status.textContent.startsWith('⚠️')) status.textContent = '✓ 已停止，確認文字後可按下方「套用至欄位」';
  };

  document.getElementById('voice-apply').addEventListener('click', () => {
    const text = textArea.value.trim();
    if (!text) { alert('沒有可解析的內容'); return; }
    const actions = parseVoiceText(text);
    applyVoiceActions(actions);
    const hits = [];
    if (actions.reminders.length) hits.push('特殊提醒 ' + actions.reminders.length + ' 項');
    if (actions.nb.enabled) hits.push('Nerve block');
    Object.keys(actions.analgesia).forEach(k => { if (actions.analgesia[k]) hits.push(k); });
    status.textContent = hits.length ? ('✓ 已套用：' + hits.join('、') + '（可手動修改）') : '⚠️ 沒有辨識到關鍵字，請手動勾選';
  });
  document.getElementById('voice-clear').addEventListener('click', () => {
    textArea.value = '';
    baseText = '';
    status.textContent = '已清除';
  });
}

window.switchPage = switchPage;
window.exportCSV = exportCSV;
window.resetAll = resetAll;
window.submitPatient = submitPatient;
window.cancelEdit = cancelEdit;
window.closeRoomChange = closeRoomChange;
window.renderBoard = renderBoard;

checkAndPurgeStaleData();
renderGroupBar();
initInputPage();
setupVoice();
scheduleNightlyPurge();
</script>
</body>
</html>
